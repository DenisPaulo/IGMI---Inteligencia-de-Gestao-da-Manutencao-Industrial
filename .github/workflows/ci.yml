name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: pipeline (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Pipeline + checks (CSV sintético; sem MySQL, sem credencial)
        run: python run.py all

      - name: Resumo da parada v2 (sintética)
        run: python run.py parada

      - name: Dataset demo (sintético) + KPIs + checks QD
        run: python run.py demo demo-preview

      - name: IGMI — relatório de confiabilidade (dados sintéticos)
        run: python run.py igmi --linha LT3 --formato markdown --saida export/igmi_relatorio_LT3.md

      - name: Testes
        run: python run.py test
